# CodeQL code scanning for the public repository (owner approval 2026-10-16). It reads the C# and the TypeScript for the
# security mistakes in the CWE Top 25 and lists what it finds under the repository's Security tab.
name: CodeQL

# No path filter, so the check always reports. The weekly run (Sunday 19:00 UTC) catches new rules on unchanged code and
# starts at a different time from weekly.yml (18:00).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 19 * * 0"

# The token starts with no rights; the job asks only for what scanning needs.
permissions: {}

# A newer push to a PR cancels its older scan; scans of main and the weekly run are never cancelled.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # C# is built by hand with the repository's own pinned SDK, so CodeQL sees the same build as CI.
      - name: setup dotnet
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: initialize codeql
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # CodeQL traces the compiler, so the shared build server is off and nothing is reused from an earlier build.
      - name: build csharp
        if: matrix.language == 'csharp'
        run: |
          dotnet restore Csps.slnx --locked-mode
          dotnet build Csps.slnx --no-restore --no-incremental -tl:off -p:UseSharedCompilation=false

      - name: analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
