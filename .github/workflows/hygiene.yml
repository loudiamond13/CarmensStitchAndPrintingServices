# OPS-03 / D-10: repository hygiene checks. GitHub's own secret scanning is not available on a free private repo,
# so gitleaks (MIT, a checksum-verified release binary) scans every pull request and every push to main.
name: Hygiene

# OPS-03: no path filter, so the check always reports. "edited" re-scans when a PR changes its base branch.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]

# OPS-03: the token starts with no rights; the job asks only to read the repository.
permissions: {}

# OPS-03: a newer push to a PR cancels its older scan; scans of main are never cancelled.
concurrency:
  group: hygiene-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # D-10: fails on any finding in the commits of the PR (base..head) or of the push.
  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # OPS-03: full history, because the scan walks the commits between the base and the head.
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # T-03-20: the binary is used only after sha256sum -c matches the owner-approved checksum (CWE-494).
      - name: install gitleaks 8.30.1 (checksum verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 --output gitleaks_8.30.1_linux_x64.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          ./gitleaks version
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # T-03-19: event values reach the script through env only (CWE-77). A zero "before" means a new branch,
      # and an unknown "before" means a rewritten history; both scan the pushed commit alone.
      - name: scan commits
        env:
          SCAN_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          SCAN_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$SCAN_BASE" ] && [ "$SCAN_BASE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${SCAN_BASE}^{commit}"; then
            range="${SCAN_BASE}..${SCAN_HEAD}"
          else
            range="-1 ${SCAN_HEAD}"
          fi
          echo "Scanning: $range"
          gitleaks git --config .gitleaks.toml --redact --no-banner --verbose --log-opts="$range" .
